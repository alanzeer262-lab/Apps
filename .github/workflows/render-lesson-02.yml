name: Render PyLearn Lesson 02

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/Video.tsx'
      - 'src/Root.tsx'
      - 'src/lesson-02.json'
      - 'docs/LESSON_02_TRANSCRIPT_TIMELINE.json'
      - 'public/audio/lesson-02/**'
      - '.github/workflows/render-lesson-02.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Node dependencies
        run: npm install
      - name: Verify Lesson 02 narration exists
        run: test -s public/audio/lesson-02/Runway_timeline_export_audio_540f76fd-8eb9-4824-b57c-e6ebc0723cf8.mp3
      - name: Type-check
        run: npm run check
      - name: Render complete Lesson 02 MP4
        run: npx remotion render src/index.ts PyLearnLesson02 out/lesson-02-variables-and-data-types.mp4
      - name: Verify rendered MP4
        run: |
          test -s out/lesson-02-variables-and-data-types.mp4
          ls -lh out/lesson-02-variables-and-data-types.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 out/lesson-02-variables-and-data-types.mp4
      - name: Upload rendered video artifact
        uses: actions/upload-artifact@v4
        with:
          name: pylearn-lesson-02-render
          path: out/lesson-02-variables-and-data-types.mp4
          if-no-files-found: error
          retention-days: 14
      - name: Publish MP4 to permanent final folder
        if: success()
        run: |
          mkdir -p public/videos/final
          cp out/lesson-02-variables-and-data-types.mp4 public/videos/final/lesson-02-variables-and-data-types.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/final/lesson-02-variables-and-data-types.mp4
          if git diff --cached --quiet; then
            echo "Final MP4 is already up to date."
          else
            git commit -m "Publish rendered PyLearn Lesson 02 video"
            git push
          fi

name: Transcribe incoming audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'incoming/audio/*.mp3'
      - '.github/workflows/transcribe-incoming-audio.yml'

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check faster-whisper
      - name: Transcribe each incoming MP3
        run: |
          mkdir -p out/incoming-audio-transcripts
          python - <<'PY'
          from pathlib import Path
          from faster_whisper import WhisperModel
          import json
          files = sorted(Path('incoming/audio').glob('*.mp3'))
          if not files:
              raise SystemExit('No MP3 files in incoming/audio')
          model = WhisperModel('base.en', device='cpu', compute_type='int8')
          manifest = []
          for f in files:
              segments, info = model.transcribe(str(f), language='en', beam_size=5, word_timestamps=True)
              lines = []
              words = []
              for s in segments:
                  lines.append(f'[{s.start:.2f}-{s.end:.2f}] {s.text.strip()}')
                  for w in (s.words or []):
                      words.append({'word': w.word, 'start': round(w.start, 3), 'end': round(w.end, 3)})
              (Path('out/incoming-audio-transcripts') / f'{f.stem}.txt').write_text('\\n'.join(lines), encoding='utf-8')
              (Path('out/incoming-audio-transcripts') / f'{f.stem}.json').write_text(json.dumps({'file':f.name,'language':info.language,'words':words},indent=2),encoding='utf-8')
              manifest.append({'file':f.name,'transcript':' '.join(s.split('] ',1)[-1] for s in lines),'word_count':len(words)})
              print('\\n### FILE:', f.name, '\\n'+'\\n'.join(lines))
          (Path('out/incoming-audio-transcripts') / 'manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pylearn-incoming-audio-transcripts
          path: out/incoming-audio-transcripts/
          if-no-files-found: error
          retention-days: 14

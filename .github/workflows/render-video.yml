name: Render PyLearn lesson video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Verify narration assets exist
        run: |
          test -f public/audio/PyLearn_Video_01_Narration_Part_1.mp3
          test -f public/audio/PyLearn_Video_01_Narration_Part_2.mp3
      - name: Type-check
        run: npm run check
      - name: Render MP4
        run: npm run render
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: pylearn-first-program
          path: out/pylearn-first-program.mp4
          if-no-files-found: error
          retention-days: 7

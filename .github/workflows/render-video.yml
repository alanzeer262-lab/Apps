name: Render PyLearn lesson video

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/videos/final/**'
      - 'docs/**'
      - 'incoming/audio/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Node dependencies
        run: npm install
      - name: Verify uploaded narration assets exist
        run: |
          test -s public/audio/lesson-01/part-01.mp3
          test -s public/audio/lesson-01/part-02.mp3
      - name: Install narration alignment dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-alignment.txt
      - name: Transcribe narration and align visual cues
        run: python scripts/align_narration.py
      - name: Prepare and validate transcript-bearing frame package
        run: python scripts/prepare_frame_package.py
      - name: Publish required frame-maker inputs BEFORE rendering
        uses: actions/upload-artifact@v4
        with:
          name: pylearn-lesson-01-frame-maker-inputs
          path: |
            out/lesson-01/transcript.json
            out/lesson-01/transcript.txt
            out/lesson-01/frame-production-package.json
            src/generated-alignment.json
            docs/LESSON_01_REVISED_STORYBOARD.json
          if-no-files-found: error
          retention-days: 14
      - name: Type-check
        run: npm run check
      - name: Render MP4 only after transcript package passes
        run: npm run render
      - name: Upload rendered video and alignment
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pylearn-lesson-01-render
          path: |
            out/pylearn-first-program.mp4
            src/generated-alignment.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve transcript diagnostics on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: pylearn-lesson-01-transcript-diagnostics
          path: |
            out/lesson-01/transcript.json
            out/lesson-01/transcript.txt
            out/lesson-01/frame-production-package.json
          if-no-files-found: warn
          retention-days: 7

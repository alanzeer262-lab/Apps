name: Render PyLearn lesson video

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Node dependencies
        run: npm install
      - name: Verify uploaded narration assets exist
        run: |
          test -f "public/audio/Agent Voiceover - Welcome to PyLearn_ I'm glad you're here_ In this lesson, we're going to write a t.mp3"
          test -f "public/audio/Agent Voiceover - Now it's your turn_ Change the name to your own name_ Before you run the program,.mp3"
          cp "public/audio/Agent Voiceover - Welcome to PyLearn_ I'm glad you're here_ In this lesson, we're going to write a t.mp3" public/audio/PyLearn_Video_01_Narration_Part_1.mp3
          cp "public/audio/Agent Voiceover - Now it's your turn_ Change the name to your own name_ Before you run the program,.mp3" public/audio/PyLearn_Video_01_Narration_Part_2.mp3
      - name: Install narration alignment dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-alignment.txt
      - name: Align visuals to spoken narration
        run: python scripts/align_narration.py
      - name: Type-check
        run: npm run check
      - name: Render MP4
        run: npm run render
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: pylearn-first-program
          path: out/pylearn-first-program.mp4
          if-no-files-found: error
          retention-days: 7

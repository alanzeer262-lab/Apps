name: Render PyLearn lesson video

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Node dependencies
        run: npm install
      - name: Verify uploaded narration assets exist
        run: |
          test -f public/audio/lesson-01/part-01.mp3
          test -f public/audio/lesson-01/part-02.mp3
      - name: Install narration alignment dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-alignment.txt
      - name: Align visuals to spoken narration
        run: python scripts/align_narration.py
      - name: Type-check
        run: npm run check
      - name: Render MP4
        run: npm run render
      - name: Upload video, transcript, and alignment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pylearn-lesson-01-render
          path: |
            out/pylearn-first-program.mp4
            out/lesson-01/transcript.json
            out/lesson-01/transcript.txt
            src/generated-alignment.json
          if-no-files-found: error
          retention-days: 7
